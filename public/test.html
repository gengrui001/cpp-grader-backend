<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Test</title></head>
<body>
<h2>Test - Click the button</h2>
<div id="msg" style="padding:10px;border:2px solid red;margin:10px">Initial text</div>
<button onclick="test1()">Test 1 - Simple</button>
<button onclick="test2()">Test 2 - Async</button>
<script>
document.getElementById("msg").textContent = "Script loaded!";
function test1() {
  document.getElementById("msg").textContent = "Test 1 clicked! " + new Date().toLocaleTimeString();
}
async function test2() {
  try {
    document.getElementById("msg").textContent = "Fetching...";
    const r = await fetch("/api/problems");
    const d = await r.json();
    document.getElementById("msg").textContent = "Got " + d.length + " problems: " + d.map(x => x.title).join(", ");
  } catch(e) {
    document.getElementById("msg").textContent = "Error: " + e.message;
  }
}
</script>
</body>
</html>
