<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>C++ ?????</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif;background:#0d1117;color:#e6edf3;height:100vh;width:100vw;overflow:hidden;display:flex;flex-direction:column}
header{background:#161b22;border-bottom:1px solid #30363d;padding:10px 16px;display:flex;align-items:center;height:48px;gap:12px}
header .logo{font-size:18px;font-weight:700;color:#58a6ff}
#layout{display:flex;flex:1;overflow:hidden;min-height:0}
#sidebar{width:40%;background:#161b22;border-right:1px solid #30363d;display:flex;flex-direction:column;overflow-y:auto}
#sidebar select{width:100%;padding:8px 12px;background:#21262d;border:1px solid #30363d;color:#e6edf3;font-size:14px;border-radius:6px;margin:8px;width:calc(100% - 16px);cursor:pointer}
#detail{padding:8px 12px;font-size:14px;line-height:1.6;display:none}
#detail.show{display:block}
#detail h3{color:#e6edf3;margin-bottom:6px}
.lb{color:#58a6ff;font-weight:600;margin-top:8px;display:block}
#detail pre{background:#21262d;padding:6px 8px;border-radius:4px;font-size:13px;margin-top:2px;border:1px solid #30363d}
#main{flex:1;display:flex;flex-direction:column}
#editor{flex:1;border:none;padding:16px;font-family:Consolas,Courier New,monospace;font-size:22px;resize:none;outline:none;background:#0d1117;color:#e6edf3;tab-size:4}
#toolbar{display:flex;align-items:center;padding:6px 12px;border-bottom:1px solid #30363d;gap:8px;flex-shrink:0}
#toolbar button{padding:5px 16px;border-radius:4px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit}
.btn-run{background:#21262d;color:#3fb950;border:1px solid #3fb950}
.btn-submit{background:#238636;color:#fff;border:1px solid rgba(240,246,252,0.1)}
#result{display:none;border-top:2px solid #30363d;padding:10px 14px;max-height:260px;overflow-y:auto;background:#0d1117;font-size:14px;white-space:pre-wrap}
#result.show{display:block}
.r-pass{color:#3fb950}.r-fail{color:#f85149}
</style>
</head>
<body>
<header><span class="logo">C++</span> ?????</header>
<div id="layout">
<div id="sidebar">
  <select id="sel"><option>???...</option></select>
  <div id="detail"></div>
</div>
<div id="main">
  <div id="toolbar">
    <button class="btn-run" id="runBtn">??</button>
    <button class="btn-submit" id="subBtn">????</button>
  </div>
  <textarea id="editor" spellcheck="false" placeholder="// ??? C++ ??"></textarea>
  <div id="result"></div><div style="display:flex;gap:8px;padding:6px 12px;border-top:1px solid #30363d;flex-shrink:0"><button class="btn-run" onclick="doRun()" style="flex:1;padding:8px;font-size:14px">?????</button></div>
</div>
</div>
<script>
var cur = null;
var API = "";
function esc(s){if(!s)return"";return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
async function loadProbs(){
  try{
    var r=await fetch(API+"/api/problems");
    var p=await r.json();
    var sel=document.getElementById("sel");
    sel.innerHTML="";
    for(var i=0;i<p.length;i++){
      var o=document.createElement("option");
      o.value=p[i].id;o.text=p[i].title;
      sel.appendChild(o);
    }
    if(p.length>0){sel.value=p[0].id;loadDetail(p[0].id)}
    sel.onchange=function(){loadDetail(this.value)};
  }catch(e){document.getElementById("sel").innerHTML="<option>????: "+e.message+"</option>"}
}
async function loadDetail(id){
  try{
    var r=await fetch(API+"/api/problems/"+id);
    var p=await r.json();
    cur=p;
    if(p.title){
      var d=document.getElementById("detail");
      d.className="show";
      d.innerHTML="<h3>"+esc(p.title)+"</h3>"+
        '<span class="lb">??</span><p>'+esc(p.description)+"</p>"+
        '<span class="lb">??</span><p>'+esc(p.inputFormat)+"</p>"+
        '<span class="lb">??</span><p>'+esc(p.outputFormat)+"</p>"+
        '<span class="lb">????</span><pre>'+esc(p.sampleInput)+"</pre>"+
        '<span class="lb">????</span><pre>'+esc(p.sampleOutput)+"</pre>";
    }
  }catch(e){document.getElementById("detail").innerHTML="<p>????</p>"}
}
async function doRun(){
  var code=document.getElementById("editor").value;
  if(!code.trim()){alert("???");return}
  if(!cur){alert("??");return}
  var res=document.getElementById("result");
  res.className="show";
  res.textContent="???...";
  try{
    var r=await fetch(API+"/api/submit",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({code:code,problemId:cur.id})});
    var d=await r.json();
    res.textContent=JSON.stringify(d,null,2);
  }catch(e){res.textContent="??: "+e.message}
}
document.getElementById("runBtn").onclick=doRun;
document.getElementById("subBtn").onclick=doRun;
loadProbs();
</script>
</body>
</html>
